<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teams</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="js/styles.css">
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <div class="nav">
    <a class="brand" href="index.html">
      <img src="assets/DVascon_Productions_Logo.png" alt="DVascon Productions logo">
      <h1 data-site-title>DVascon Productions</h1>
    </a>

    <i class="fa-solid fa-bars burger" onclick="toggleMenu()"></i>
  </div>

  <div class="menu" id="menu">
    <div id="menuSports"></div>
    <a data-contact target="_blank">Contact</a>
  </div>

  <main class="page">
    <a href="index.html" class="back">← Back</a>
    <h2 id="title"></h2>
    <div id="teams"></div>
  </main>

  <script>
    const sport = qs("sport");
    document.getElementById("title").textContent = folderLabel(sport) || "Teams";

    async function load() {
      await buildMenu();

      const container = document.getElementById("teams");
      const teamList = await listR2(sport);

      if (!teamList.folders.length) {
        showEmpty(container, "No teams found for this sport yet.");
        return;
      }

      for (const teamFolder of teamList.folders) {
        const team = getFolderName(teamFolder);
        const teamBlock = document.createElement("div");

        teamBlock.className = "team";
        teamBlock.innerHTML = `
          <h3>${folderLabel(team)}</h3>
          <div class="event-grid"></div>
        `;

        const grid = teamBlock.querySelector(".event-grid");
        const events = await listR2(joinPath(sport, team));

        for (const eventFolderPrefix of events.folders) {
          const event = getFolderName(eventFolderPrefix);
          const files = await listR2(joinPath(sport, team, event));
          const coverObject = files.files.find(file => isImage(file.name));
          const cover = coverObject ? mediaUrl(coverObject.key) : "assets/BG_Website.jpg";
          const card = document.createElement("div");

          card.className = "event-card";
          card.innerHTML = `
            <div class="event-image" style="background-image:url('${cover}')"></div>
            <div class="event-info">
              <h4>${cleanEventName(event)}</h4>
              <span>${formatDate(event)}</span>
            </div>
          `;
          card.onclick = () => {
            location.href = `gallery.html?sport=${encodeURIComponent(sport)}&team=${encodeURIComponent(team)}&event=${encodeURIComponent(event)}`;
          };

          grid.appendChild(card);
        }

        container.appendChild(teamBlock);
      }
    }

    load().catch(error => {
      console.error(error);
      showEmpty(document.getElementById("teams"), error.message);
    });
  </script>
</body>
</html>
