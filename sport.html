<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Teams</title><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="js/config.js"></script>
<script src="js/app.js"></script><style>:root{--bg:#05060A;--card:#111827;--text:#E5E7EB;--muted:#9CA3AF}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}.nav{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;background:rgba(5,6,10,.85);backdrop-filter:blur(10px);z-index:1000}.nav-left,.brand-link{display:flex;align-items:center;gap:.85rem}.brand-link{text-decoration:none;color:inherit}.nav img{height:44px;width:auto}.nav h1{font-size:1.15rem;font-weight:600;letter-spacing:.02em}.burger{font-size:1.4rem;cursor:pointer}.menu{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.5rem;transform:translateY(-100%);transition:.35s ease;z-index:999}.menu.open{transform:translateY(0)}.menu button{background:none;border:none;color:white;font-size:1.2rem;cursor:pointer}.menu-divider{width:200px;height:1px;background:rgba(255,255,255,.15);margin:1.5rem 0}.contact-btn{display:flex;align-items:center;justify-content:center;width:200px;margin-top:1.2rem;padding:.75rem 1rem;font-size:.9rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#05060A;background:white;border-radius:10px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:.25s ease}.contact-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.45)}a{color:#9CA3AF;text-decoration:none}body{padding:2rem;padding-top:64px}.team{margin-top:2.5rem}.team h3{margin-bottom:1rem;font-weight:500}.event-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem}.event-card{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;background:#111827;transition:.35s}.event-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 30px 60px rgba(0,0,0,.6)}.event-image{height:200px;background-size:cover;background-position:center;transition:.5s}.event-card:hover .event-image{transform:scale(1.08)}.event-info{position:absolute;bottom:0;width:100%;padding:1rem;background:linear-gradient(to top,rgba(0,0,0,.75),transparent)}.event-info h4{margin:0;font-size:1rem;font-weight:600}.event-info span{font-size:.8rem;color:#9CA3AF}</style></head><body><div class="nav">
  <div class="nav-left">
    <a href="index.html" class="brand-link">
      <img data-logo src="assets/DVascon_Productions_Logo.png" alt="DVascon Productions logo">
      <h1 data-site-title>DVascon Productions</h1>
    </a>
  </div>
  <i class="fa-solid fa-bars burger" onclick="toggleMenu()"></i>
</div>
<div class="menu" id="menu">
  <div id="menuSports"></div>
  <div class="menu-divider"></div>
  <a data-contact href="https://dot.cards/dvascon_productions" target="_blank" class="contact-btn">Contact</a>
</div><a href="index.html">← Back</a><h2 id="title">Teams</h2><div id="teams"></div>
<script>
loadData().then(data => {
  buildNav(data);
  const sport = findSport(data, qs('sport'));
  const container = document.getElementById('teams');
  document.getElementById('title').textContent = sport?.name || 'Teams';
  if(!sport) return showEmpty(container, 'Sport not found.');
  if(!(sport.teams || []).length) return showEmpty(container, 'No teams found for this sport yet.');
  sport.teams.forEach(team => {
    const block = document.createElement('div');
    block.className = 'team';
    block.innerHTML = `<h3>${team.name}</h3><div class="event-grid"></div>`;
    const grid = block.querySelector('.event-grid');
    (team.events || []).forEach(event => {
      const coverFile = event.cover || (event.files || []).find(isImage) || (event.files || [])[0] || '';
      const cover = coverFile ? eventFileUrl(sport, team, event, coverFile) : 'assets/BG_Website.jpg';
      const card = document.createElement('div');
      card.className = 'event-card';
      card.innerHTML = `<div class="event-image" style="background-image:url('${cover}')"></div><div class="event-info"><h4>${event.title}</h4><span>${formatDate(event.date)}</span></div>`;
      card.onclick = () => location.href = `gallery.html?sport=${encodeURIComponent(sport.slug)}&team=${encodeURIComponent(team.slug)}&event=${encodeURIComponent(event.slug)}`;
      grid.appendChild(card);
    });
    container.appendChild(block);
  });
}).catch(console.error);
</script></body></html>
