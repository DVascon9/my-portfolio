<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Teams</title><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><script src="js/config.js"></script><script src="js/app.js"></script><style>body{margin:0;padding:2rem;padding-top:64px;background:#05060A;color:white;font-family:Inter,sans-serif}a{color:#9CA3AF;text-decoration:none}.nav{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;background:rgba(5,6,10,.85);backdrop-filter:blur(10px);z-index:1000}.brand{display:flex;align-items:center;gap:.85rem;color:inherit;text-decoration:none}.brand img{height:44px;width:auto}.brand h1{font-size:1.15rem;font-weight:600}.burger{font-size:1.4rem;cursor:pointer}.menu{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.5rem;transform:translateY(-100%);transition:.35s ease;z-index:999}.menu.open{transform:translateY(0)}.menu button{background:none;border:none;color:white;font-size:1.2rem;cursor:pointer}.menu a{margin-top:2rem;color:#9CA3AF}.team{margin-top:2.5rem}.team h3{margin-bottom:1rem;font-weight:500}.event-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem}.event-card{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;background:#111827;transition:.35s}.event-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 30px 60px rgba(0,0,0,.6)}.event-image{height:200px;background-size:cover;background-position:center;transition:.5s}.event-info{position:absolute;bottom:0;width:100%;padding:1rem;background:linear-gradient(to top,rgba(0,0,0,.8),transparent)}.event-info h4{margin:0;font-size:1rem}.event-info span{font-size:.8rem;color:#9CA3AF}</style></head><body><div class="nav"><a class="brand" href="index.html"><img src="assets/DVascon_Productions_Logo.png" alt="DVascon Productions logo"><h1 data-site-title>DVascon Productions</h1></a><i class="fa-solid fa-bars burger" onclick="toggleMenu()"></i></div><div class="menu" id="menu"><div id="menuSports"></div><a data-contact target="_blank">Contact</a></div><a href="index.html">← Back</a><h2 id="title"></h2><div id="teams"></div><script>const sport=qs("sport");document.getElementById("title").textContent=folderLabel(sport)||"Teams";async function load(){await buildMenu();const container=document.getElementById("teams");const teamList=await listR2(sport);if(!teamList.folders.length){showEmpty(container,"No teams found for this sport yet.");return;}for(const teamFolder of teamList.folders){const team=getFolderName(teamFolder);const teamBlock=document.createElement("div");teamBlock.className="team";teamBlock.innerHTML=`<h3>${folderLabel(team)}</h3><div class="event-grid"></div>`;const grid=teamBlock.querySelector(".event-grid");const events=await listR2(joinPath(sport,team));for(const eventFolderPrefix of events.folders){const event=getFolderName(eventFolderPrefix);const files=await listR2(joinPath(sport,team,event));const coverObj=files.files.find(f=>isImage(f.name));const cover=coverObj?mediaUrl(coverObj.key):"assets/BG_Website.jpg";const card=document.createElement("div");card.className="event-card";card.innerHTML=`<div class="event-image" style="background-image:url('${cover}')"></div><div class="event-info"><h4>${cleanEventName(event)}</h4><span>${formatDate(event)}</span></div>`;card.onclick=()=>location.href=`gallery.html?sport=${encodeURIComponent(sport)}&team=${encodeURIComponent(team)}&event=${encodeURIComponent(event)}`;grid.appendChild(card);}container.appendChild(teamBlock);}}load().catch(err=>{console.error(err);showEmpty(document.getElementById("teams"),err.message);});</script></body></html>
