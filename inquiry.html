<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book DVascon Productions</title>

<link rel="stylesheet" href="js/styles.css">

<style>
.form-wrap{
  max-width:700px;
  margin:120px auto 40px;
  padding:2rem;
}

.form-wrap h2{
  margin-bottom:1rem;
}

.form-group{
  margin-bottom:1rem;
}

input,
textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#111827;
  color:white;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="nav">
  <a class="brand" href="index.html">
    <img src="assets/DVascon_Productions_Logo.png">
    <h1>DVascon Productions</h1>
  </a>
</div>

<div class="form-wrap">

<h2>Booking Inquiry</h2>

<form
  action="https://formspree.io/f/mnjyzkar"
  method="POST">

  <div class="form-group">
    <input
      type="text"
      name="name"
      placeholder="Your Name"
      required>
  </div>

  <div class="form-group">
    <input
      type="email"
      name="email"
      placeholder="Your Email"
      required>
  </div>

  <div class="form-group">
    <input
      type="text"
      name="team"
      placeholder="Team / Organization">
  </div>

  <div class="form-group">
    <input
      type="date"
      name="event_date">
  </div>

  <div class="form-group">
    <textarea
      name="message"
      placeholder="Tell me about your event..."
      required></textarea>
  </div>

  <button type="submit">
    Send Inquiry
  </button>

</form>

</div>

</body>
</html>
