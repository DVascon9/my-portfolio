<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DVascon Productions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="js/styles.css">
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <style>
    .hero {
      margin-top: 64px;
      height: 55vh;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, .55), #05060A),
        url("assets/BG_Website.jpg") center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .hero h2 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      margin-bottom: .5rem;
    }

    .hero p {
      color: var(--muted);
    }

    .hero > div {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .section {
      padding: 3rem 2rem;
      max-width: 1200px;
      margin: auto;
    }

    .site-footer {
      text-align: center;
      padding: 1rem 0;
      border-top: 2px solid rgba(255, 255, 255, .2);
      margin-top: 2rem;
    }

    .site-footer a {
      display: inline-block;
      margin: 1rem auto;
      padding: .5rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: var(--card);
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="nav">
    <a class="brand" href="index.html">
      <img src="assets/DVascon_Productions_Logo.png" alt="DVascon Productions logo">
      <h1 data-site-title>DVascon Productions</h1>
    </a>

    <i class="fa-solid fa-bars burger" onclick="toggleMenu()"></i>
  </div>

  <div class="menu" id="menu">
    <div id="menuSports"></div>

    <div class="menu-divider"></div>

    <a data-contact target="_blank" class="contact-btn">
      Contact
    </a>

    <a href="inquiry.html" class="contact-btn">
      Schedule a Shoot
    </a>
  </div>

  <section class="hero">
    <div>
      <h2>DVascon Productions</h2>
      <p>Sports photography & event coverage</p>

      <div
        style="
          display:flex;
          gap:1rem;
          flex-wrap:wrap;
          justify-content:center;
          margin-top:1rem;
        "
      >
        <a
          data-contact
          target="_blank"
          class="contact-btn"
        >
          Contact
        </a>

        <a
          href="inquiry.html"
          class="contact-btn"
         >
          Schedule a Shoot
        </a>
      </div>
    </div>
  </section>

  <section class="featured-slideshow" aria-labelledby="featured-title">
    <div class="featured-heading">
      <div>
        <p class="eyebrow">A closer look</p>
        <h2 id="featured-title">Featured frames</h2>
      </div>
    </div>

    <div class="slideshow" id="featuredSlideshow">
      <div class="slide-track" id="slideTrack"></div>
    </div>
  </section>

  <section class="section">

    <input
      id="search"
      type="text"
      placeholder="Search sports, teams, events..."
      style="
        width:100%;
        padding:1rem;
        margin-bottom:2rem;
        border-radius:10px;
        border:none;
        background:#111827;
        color:white;
        font-size:1rem;
      "
    >

    <div id="searchResults" class="search-results"></div>

    <div class="grid" id="sports"></div>
  </section>

  <footer class="site-footer">
   <a href="about.html">About</a>
    <a href="inquiry.html">Schedule a Shoot</a>
  </footer>

  <script>
    async function loadSports() {
     const grid = document.getElementById("sports");

      showLoading(grid, "Loading sports...");

      await buildMenu();

     const root = await listR2("");

      if (!root.folders.length) {
        showEmpty(grid, "No folders found in R2 yet.");
        return;
      }

      grid.innerHTML = "";

      root.folders.forEach(folder => {
        const sport = getFolderName(folder);
        const card = document.createElement("div");

        card.className = "card";
        card.innerHTML = `
          <div>
            <i class="fa-solid ${icon(sport)}"></i>
            <div>${folderLabel(sport)}</div>
          </div>
        `;

        card.onclick = () => {
          location.href = `sport.html?sport=${encodeURIComponent(sport)}`;
       };

        grid.appendChild(card);
      });
    }

    loadSports().catch(error => {
      console.error(error);
      showEmpty(document.getElementById("sports"), error.message);
    });

    const searchInput = document.getElementById("search");
    const searchResults = document.getElementById("searchResults");

    let searchableGalleries = [];

    async function loadSearchIndex() {
      const response = await fetch("/api/search", {
        cache: "no-store"
      });

      if (!response.ok) {
        console.error("Could not load search index");
        return;
     }

      const data = await response.json();
      searchableGalleries = data.results || [];
    }

    function renderSearchResults(query) {
     const normalizedQuery = query.trim().toLowerCase();
     searchResults.innerHTML = "";

     if (!normalizedQuery) return;

     const matches = searchableGalleries
       .filter(item => item.label.toLowerCase().includes(normalizedQuery))
       .slice(0, 10);

     if (!matches.length) {
        searchResults.innerHTML = `
         <p style="color:#9CA3AF;">No results found.</p>
        `;
        return;
      }

     matches.forEach(item => {
        const result = document.createElement("div");
       result.className = "search-result";
        result.textContent = item.label;
        result.onclick = () => {
          location.href = item.url;
       };

        searchResults.appendChild(result);
     });
    }

    searchInput.addEventListener("input", event => {
      renderSearchResults(event.target.value);
    });

    loadSearchIndex();

    const featuredSlides = [
      { src: "assets/vs_Butler_DVascon_prod16.jpg", alt: "Sports action photo from Butler" },
      { src: "assets/vs_Butler_DVascon_prod15.jpg", alt: "Sports action photo from Butler" },
      { src: "assets/vs UNI-32.jpg", alt: "Sports action photo from UNI" },
      { src: "assets/vs UNI-24.jpg", alt: "Sports action photo from UNI" },
      { src: "assets/vs_Butler-DVascon_Productions.jpg", alt: "Sports action photo from Butler" },
      { src: "assets/Vs_Georgetown_DVascon_Prod-7.jpg", alt: "Sports action photo from Georgetown" },
      { src: "assets/vs_Gonzaga_DVascon-77.jpg", alt: "Sports action photo from Gonzaga" },
      { src: "assets/vs_Saint Mary_DVascon-4.jpg", alt: "Sports action photo from Saint Mary" },
      { src: "assets/vs_Nebraska_DVascon-25.jpg", alt: "Sports action photo from Nebraska" },
      { src: "assets/vs_Atlanta Vibe-42.jpg", alt: "Sports action photo from Atlanta Vibe" }
    ];
    const slideTrack = document.getElementById("slideTrack");
    const slideshow = document.getElementById("featuredSlideshow");
    let activeSlide = 1;
    let pointerStartX = 0;
    let autoSlideTimer;

    function renderSlideshow() {
      if (!featuredSlides.length) {
        slideTrack.innerHTML = `
          <div class="slide-empty">
            <i class="fa-solid fa-images" aria-hidden="true"></i>
            <p>Your next set of moments will live here.</p>
            <span>Add the photos when they are ready.</span>
          </div>
        `;
        return;
      }

      const slidesWithClones = [
        featuredSlides[featuredSlides.length - 1],
        ...featuredSlides,
        featuredSlides[0]
      ];

      slideTrack.innerHTML = slidesWithClones.map(slide => `
        <figure class="slide">
          <img src="${slide.src}" alt="${slide.alt}" draggable="false">
        </figure>
      `).join("");

      updateSlideshow();
      scheduleNextSlide();
    }

    function updateSlideshow(animate = true) {
      slideTrack.style.transition = animate ? "" : "none";
      slideTrack.style.transform = `translateX(-${activeSlide * 100}%)`;

      if (!animate) {
        slideTrack.offsetWidth;
        requestAnimationFrame(() => {
          slideTrack.style.transition = "";
        });
      }
    }

    function goToSlide(index) {
      if (!featuredSlides.length) return;
      activeSlide = index;
      updateSlideshow();
      scheduleNextSlide();
    }

    function scheduleNextSlide() {
      clearTimeout(autoSlideTimer);

      if (featuredSlides.length < 2) return;

      autoSlideTimer = setTimeout(() => {
        goToSlide(activeSlide + 1);
      }, 5700);
    }

    slideTrack.addEventListener("transitionend", event => {
      if (event.propertyName !== "transform") return;

      if (activeSlide === 0) {
        activeSlide = featuredSlides.length;
        updateSlideshow(false);
      }

      if (activeSlide === featuredSlides.length + 1) {
        activeSlide = 1;
        updateSlideshow(false);
      }
    });

    slideshow.addEventListener("pointerdown", event => {
      pointerStartX = event.clientX;
      slideshow.setPointerCapture(event.pointerId);
    });
    slideshow.addEventListener("pointerup", event => {
      const distance = event.clientX - pointerStartX;
      if (Math.abs(distance) > 45) goToSlide(activeSlide + (distance < 0 ? 1 : -1));
      slideshow.releasePointerCapture(event.pointerId);
    });
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") goToSlide(activeSlide - 1);
      if (event.key === "ArrowRight") goToSlide(activeSlide + 1);
    });

    renderSlideshow();
  </script>
</body>
</html>
