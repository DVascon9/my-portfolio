<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>DVascon Productions</title><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<style>:root{--bg:#05060A;--card:#111827;--text:#E5E7EB;--muted:#9CA3AF}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}.nav{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;background:rgba(5,6,10,.85);backdrop-filter:blur(10px);z-index:1000}.nav-left,.brand-link{display:flex;align-items:center;gap:.85rem}.brand-link{text-decoration:none;color:inherit}.nav img{height:44px;width:auto}.nav h1{font-size:1.15rem;font-weight:600;letter-spacing:.02em}.burger{font-size:1.4rem;cursor:pointer}.menu{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.5rem;transform:translateY(-100%);transition:.35s ease;z-index:999}.menu.open{transform:translateY(0)}.menu button{background:none;border:none;color:white;font-size:1.2rem;cursor:pointer}.menu-divider{width:200px;height:1px;background:rgba(255,255,255,.15);margin:1.5rem 0}.contact-btn{display:flex;align-items:center;justify-content:center;width:200px;margin-top:1.2rem;padding:.75rem 1rem;font-size:.9rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#05060A;background:white;border-radius:10px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:.25s ease}.contact-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.45)}a{color:#9CA3AF;text-decoration:none}.hero{margin-top:64px;height:55vh;background:linear-gradient(to bottom,rgba(0,0,0,.55),#05060A),url("assets/BG_Website.jpg") center/cover no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}.hero h2{font-size:clamp(2.2rem,4vw,3rem);margin-bottom:.5rem}.hero p{color:var(--muted)}.hero>div{display:flex;flex-direction:column;align-items:center}.section{padding:3rem 2rem;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.5rem}.card{height:160px;border-radius:18px;background:#111827;display:flex;align-items:flex-end;padding:1.2rem;cursor:pointer;transition:.3s}.card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(0,0,0,.6)}.card i{font-size:1.8rem;margin-bottom:.4rem}.site-footer{text-align:center;padding:1rem 0;border-top:2px solid rgba(255,255,255,.2);margin-top:2rem}.site-footer a{display:inline-block;margin:1rem auto;padding:.5rem 1rem;font-size:1rem;font-weight:600;color:white;background:var(--card);border-radius:8px;text-decoration:none}</style></head>
<body><div class="nav">
  <div class="nav-left">
    <a href="index.html" class="brand-link">
      <img data-logo src="assets/DVascon_Productions_Logo.png" alt="DVascon Productions logo">
      <h1 data-site-title>DVascon Productions</h1>
    </a>
  </div>
  <i class="fa-solid fa-bars burger" onclick="toggleMenu()"></i>
</div>
<div class="menu" id="menu">
  <div id="menuSports"></div>
  <div class="menu-divider"></div>
  <a data-contact href="https://dot.cards/dvascon_productions" target="_blank" class="contact-btn">Contact</a>
</div>
<section class="hero"><div><h2>DVascon Productions</h2><p>Sports photography & event coverage</p><a data-contact href="https://dot.cards/dvascon_productions" target="_blank" class="contact-btn">Contact</a></div></section>
<section class="section"><div class="grid" id="sports"></div></section>
<footer class="site-footer"><a href="about.html">About</a></footer>
<script>
loadData().then(data => {
  buildNav(data);
  const grid = document.getElementById('sports');
  if(!(data.sports || []).length) return showEmpty(grid, 'No galleries found yet. Add galleries in data.json.');
  data.sports.forEach(sport => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div><i class="fa-solid ${icon(sport.name)}"></i><div>${sport.name}</div></div>`;
    card.onclick = () => location.href = `sport.html?sport=${encodeURIComponent(sport.slug)}`;
    grid.appendChild(card);
  });
}).catch(console.error);
</script></body></html>
