<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DVascon Productions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="js/styles.css">
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <style>
    .hero {
      margin-top: 64px;
      height: 55vh;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, .55), #05060A),
        url("assets/BG_Website.jpg") center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .hero h2 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      margin-bottom: .5rem;
    }

    .hero p {
      color: var(--muted);
    }

    .hero > div {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .section {
      padding: 3rem 2rem;
      max-width: 1200px;
      margin: auto;
    }

    .site-footer {
      text-align: center;
      padding: 1rem 0;
      border-top: 2px solid rgba(255, 255, 255, .2);
      margin-top: 2rem;
    }

    .site-footer a {
      display: inline-block;
      margin: 1rem auto;
      padding: .5rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: var(--card);
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="nav">
    <a class="brand" href="index.html">
      <img src="assets/DVascon_Productions_Logo.png" alt="DVascon Productions logo">
      <h1 data-site-title>DVascon Productions</h1>
    </a>

    <i class="fa-solid fa-bars burger" onclick="toggleMenu()"></i>
  </div>

  <div class="menu" id="menu">
    <div id="menuSports"></div>
    <div class="menu-divider"></div>
    <a data-contact target="_blank" class="contact-btn">Contact</a>
  </div>

  <section class="hero">
    <div>
      <h2>DVascon Productions</h2>
      <p>Sports photography & event coverage</p>
      <a data-contact target="_blank" class="contact-btn">Contact</a>
    </div>
  </section>

  <section class="section">
    <div class="grid" id="sports"></div>
  </section>

  <footer class="site-footer">
    <a href="about.html">About</a>
  </footer>

  <script>
    async function loadSports() {
      const grid = document.getElementById("sports");

     showLoading(grid, "Loading sports...");


      await buildMenu();

      const root = await listR2("");
      const grid = document.getElementById("sports");

      if (!root.folders.length) {
        showEmpty(grid, "No folders found in R2 yet.");
        return;
      }

      root.folders.forEach(folder => {
        const sport = getFolderName(folder);
        const card = document.createElement("div");

        card.className = "card";
        card.innerHTML = `
          <div>
            <i class="fa-solid ${icon(sport)}"></i>
            <div>${folderLabel(sport)}</div>
          </div>
        `;
        card.onclick = () => {
          location.href = `sport.html?sport=${encodeURIComponent(sport)}`;
        };

        grid.appendChild(card);
      });
    }

    loadSports().catch(error => {
      console.error(error);
      showEmpty(document.getElementById("sports"), error.message);
    });
  </script>
</body>
</html>
