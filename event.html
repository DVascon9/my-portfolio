<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Events</title><meta name="viewport" content="width=device-width, initial-scale=1"><script src="js/config.js"></script><script src="js/app.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>body{margin:0;padding:2rem;padding-top:64px;background:#05060A;color:white;font-family:Inter,sans-serif}a{color:white;opacity:.7;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem;margin-top:2rem}.card{padding:2rem;background:#111827;border-radius:14px;text-align:center;cursor:pointer;transition:.25s}.card:hover{transform:translateY(-4px)}.nav{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;background:rgba(5,6,10,.85);backdrop-filter:blur(10px);z-index:1000}.brand{display:flex;align-items:center;gap:.85rem;color:inherit;text-decoration:none}.brand img{height:44px;width:auto}.brand h1{font-size:1.15rem;font-weight:600}.burger{font-size:1.4rem;cursor:pointer}.menu{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.5rem;transform:translateY(-100%);transition:.35s ease;z-index:999}.menu.open{transform:translateY(0)}.menu button{background:none;border:none;color:white;font-size:1.2rem;cursor:pointer}.menu a{margin-top:2rem;color:#9CA3AF;text-decoration:none}</style></head><body><div class="nav"><a class="brand" href="index.html"><img src="assets/DVascon_Productions_Logo.png" alt="DVascon Productions logo"><h1 data-site-title>DVascon Productions</h1></a><i class="fa-solid fa-bars burger" onclick="toggleMenu()"></i></div><div class="menu" id="menu"><div id="menuSports"></div><a data-contact target="_blank">Contact</a></div><a id="back">← Back</a><h2 id="title"></h2><div class="grid" id="events"></div><script>const sport=qs("sport"),team=qs("team");document.getElementById("title").textContent=`${folderLabel(sport)} • ${folderLabel(team)}`;document.getElementById("back").href=`sport.html?sport=${encodeURIComponent(sport)}`;async function loadEvents(){await buildMenu();const container=document.getElementById("events");const data=await listR2(joinPath(sport,team));if(!data.folders.length){showEmpty(container,"No events found for this team yet.");return;}data.folders.forEach(folder=>{const event=getFolderName(folder);const div=document.createElement("div");div.className="card";div.textContent=cleanEventName(event);div.onclick=()=>location.href=`gallery.html?sport=${encodeURIComponent(sport)}&team=${encodeURIComponent(team)}&event=${encodeURIComponent(event)}`;container.appendChild(div);});}loadEvents().catch(err=>{console.error(err);showEmpty(document.getElementById("events"),err.message);});</script></body></html>
