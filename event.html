<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="js/styles.css">
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <div class="nav">
    <a class="brand" href="index.html">
      <img src="assets/DVascon_Productions_Logo.png" alt="DVascon Productions logo">
      <h1 data-site-title>DVascon Productions</h1>
    </a>

    <i class="fa-solid fa-bars burger" onclick="toggleMenu()"></i>
  </div>

  <div class="menu" id="menu">
    <div id="menuSports"></div>
    <a data-contact target="_blank">Contact</a>
  </div>

  <main class="page">
    <a id="back" class="back">← Back</a>
    <h2 id="title"></h2>
    <div class="grid" id="events"></div>
  </main>

  <script>
    const sport = qs("sport");
    const team = qs("team");

    document.getElementById("title").textContent = `${folderLabel(sport)} • ${folderLabel(team)}`;
    document.getElementById("back").href = `sport.html?sport=${encodeURIComponent(sport)}`;

    async function loadEvents() {
      await buildMenu();

      const container = document.getElementById("events");
      const data = await listR2(joinPath(sport, team));

      if (!data.folders.length) {
        showEmpty(container, "No events found for this team yet.");
        return;
      }

      data.folders.forEach(folder => {
        const event = getFolderName(folder);
        const card = document.createElement("div");

        card.className = "card";
        card.textContent = cleanEventName(event);
        card.onclick = () => {
          location.href = `gallery.html?sport=${encodeURIComponent(sport)}&team=${encodeURIComponent(team)}&event=${encodeURIComponent(event)}`;
        };

        container.appendChild(card);
      });
    }

    loadEvents().catch(error => {
      console.error(error);
      showEmpty(document.getElementById("events"), error.message);
    });
  </script>
</body>
</html>
