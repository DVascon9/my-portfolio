<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="js/styles.css">
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <style>
    .masonry {
      columns: 4 260px;
      column-gap: 1rem;
      padding: 1rem;
      padding-top: 88px;
    }

    .masonry img,
    .masonry video {
      width: 100%;
      margin-bottom: 1rem;
      border-radius: 12px;
      cursor: pointer;
      background: #111827;
    }

    .gallery-back {
      position: fixed;
      top: 72px;
      left: 1rem;
      z-index: 900;
      color: #9CA3AF;
      text-decoration: none;
      background: rgba(5, 6, 10, .7);
      padding: .5rem .75rem;
      border-radius: 8px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .lightbox.open {
      display: flex;
    }

    .box {
      background: #0b0b0b;
      padding: 1rem;
      border-radius: 16px;
    }

    .box img,
    .box video {
      max-width: 80vw;
      max-height: 70vh;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: .75rem;
      margin-top: .75rem;
    }

    button {
      background: #1f2937;
      border: none;
      color: white;
      padding: .5rem .9rem;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="nav">
    <a class="brand" href="index.html">
      <img src="assets/DVascon_Productions_Logo.png" alt="DVascon Productions logo">
      <h1 data-site-title>DVascon Productions</h1>
    </a>

    <i class="fa-solid fa-bars burger" onclick="toggleMenu()"></i>
  </div>

  <div class="menu" id="menu">
    <div id="menuSports"></div>
    <a data-contact target="_blank">Contact</a>
  </div>

  <a href="javascript:history.back()" class="gallery-back">← Back</a>

  <div class="masonry" id="gallery"></div>

  <div class="lightbox" id="lb">
    <div class="box">
      <div id="mediaBox"></div>
      <div class="controls">
        <button onclick="downloadCurrent()">⬇ Download</button>
        <button onclick="closeLB()">✕</button>
      </div>
    </div>
  </div>

  <script>
    const sport = qs("sport");
    const team = qs("team");
    const eventName = qs("event");
    const gallery = document.getElementById("gallery");
    const lb = document.getElementById("lb");
    const mediaBox = document.getElementById("mediaBox");

    let files = [];
    let urls = [];
    let index = 0;

    async function load() {
      showLoading(gallery, "Loading gallery...");
      
      await buildMenu();

      const listed = await listR2(joinPath(sport, team, eventName));

      files = listed.files.filter(file => isMedia(file.name));
      urls = files.map(file => mediaUrl(file.key));

      if (!files.length) {
        showEmpty(gallery, "No media found for this event yet.");
        return;
      }

      files.forEach((file, currentIndex) => {
        let element;

        if (isVideo(file.name)) {
          element = document.createElement("video");
          element.src = urls[currentIndex];
          element.muted = true;
          element.playsInline = true;
          element.preload = "metadata";
        } else {
          element = document.createElement("img");
          element.src = urls[currentIndex];
          element.loading = "lazy";
        }

        element.onclick = () => openLB(currentIndex);
        gallery.appendChild(element);
      });
    }

    function renderCurrent() {
      mediaBox.innerHTML = "";

      const file = files[index];
      let element;

      if (isVideo(file.name)) {
        element = document.createElement("video");
        element.src = urls[index];
        element.controls = true;
        element.autoplay = true;
      } else {
        element = document.createElement("img");
        element.src = urls[index];
      }

      mediaBox.appendChild(element);
    }

    function openLB(currentIndex) {
      index = currentIndex;
      renderCurrent();
      lb.classList.add("open");
    }

    function closeLB() {
      lb.classList.remove("open");
      mediaBox.innerHTML = "";
    }

    function downloadCurrent() {
      const anchor = document.createElement("a");
      anchor.href = urls[index];
      anchor.download = files[index].name;
      anchor.target = "_blank";
      anchor.click();
    }

    document.addEventListener("keydown", event => {
      if (!lb.classList.contains("open")) return;

      if (event.key === "ArrowRight") openLB((index + 1) % files.length);
      if (event.key === "ArrowLeft") openLB((index - 1 + files.length) % files.length);
      if (event.key === "Escape") closeLB();
    });

    lb.onclick = event => {
      if (event.target === lb) closeLB();
    };

    load().catch(error => {
      console.error(error);
      showEmpty(gallery, error.message);
    });
  </script>
</body>
</html>
