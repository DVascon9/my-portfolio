<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Gallery</title><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><script src="js/cloudflare.js"></script><style>body{margin:0;padding-top:64px;background:#05060A;color:white;font-family:Inter,sans-serif}a{color:#9CA3AF;text-decoration:none;padding:1rem;display:inline-block}.grid{columns:4 260px;column-gap:1rem;padding:1rem}.grid img,.grid video{width:100%;margin-bottom:1rem;border-radius:12px;cursor:pointer;background:#111827}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:2000}.lightbox.open{display:flex}.box{background:#0b0b0b;padding:1rem;border-radius:16px}.box img,.box video{max-width:80vw;max-height:70vh}.controls{display:flex;justify-content:space-between;gap:.75rem;margin-top:.75rem}button{background:#1f2937;border:none;color:white;padding:.5rem .9rem;border-radius:8px;cursor:pointer}.nav{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;background:rgba(5,6,10,.85);backdrop-filter:blur(10px);z-index:1000}.nav-left{display:flex;align-items:center;gap:.75rem}.nav img{height:34px}.nav h1{font-size:1.05rem;font-weight:500}.burger{font-size:1.4rem;cursor:pointer}.menu{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.5rem;transform:translateY(-100%);transition:.35s ease;z-index:999}.menu.open{transform:translateY(0)}.menu button{background:none;border:none;color:white;font-size:1.2rem;cursor:pointer}.menu a{margin-top:2rem;color:#9CA3AF;text-decoration:none}</style></head><body><div class="nav"><div class="nav-left"><a href="index.html" style="display:flex;align-items:center;gap:.75rem;text-decoration:none;color:inherit"><img src="https://dvascon.com/wp-content/uploads/2025/08/cropped-dvascon_productions_logo_transbg-67356-1-edited.png"><h1>Dvascon Productions</h1></a></div><i class="fa-solid fa-bars burger" onclick="toggleMenu()"></i></div><div class="menu" id="menu"><div id="menuSports"></div><a href="https://dot.cards/dvascon_productions" target="_blank">Contact</a></div><a href="javascript:history.back()">← Back</a><div class="grid" id="gallery"></div><div class="lightbox" id="lb"><div class="box"><div id="mediaBox"></div><div class="controls"><button onclick="downloadCurrent()">⬇ Download</button><button onclick="closeLB()">✕</button></div></div></div><script>
const p=new URLSearchParams(location.search);const sport=p.get("sport"),team=p.get("team"),eventName=p.get("event");const gallery=document.getElementById("gallery"),lb=document.getElementById("lb"),mediaBox=document.getElementById("mediaBox");let files=[],urls=[],index=0;
async function load(){
  const data=await loadGalleryData();
  const menu=document.getElementById("menuSports");
  getSports(data).forEach(s=>{const b=document.createElement("button");b.textContent=s;b.onclick=()=>location.href=`sport.html?sport=${encodeURIComponent(s)}`;menu.appendChild(b);});
  files=getMedia(data,sport,team,eventName); urls=files.map(f=>mediaUrl(`${sport}/${team}/${eventName}/${f}`));
  if(!files.length){showEmpty(gallery,"No media found for this event yet.");return;}
  files.forEach((file,i)=>{
    let el;
    if(isVideo(file)){el=document.createElement("video");el.src=urls[i];el.muted=true;el.playsInline=true;el.preload="metadata";}
    else{el=document.createElement("img");el.src=urls[i];el.loading="lazy";}
    el.onclick=()=>openLB(i);gallery.appendChild(el);
  });
}
function renderCurrent(){mediaBox.innerHTML="";const file=files[index];let el;if(isVideo(file)){el=document.createElement("video");el.src=urls[index];el.controls=true;el.autoplay=true;}else{el=document.createElement("img");el.src=urls[index];}mediaBox.appendChild(el);}
function openLB(i){index=i;renderCurrent();lb.classList.add("open");}
function closeLB(){lb.classList.remove("open");mediaBox.innerHTML="";}
function downloadCurrent(){const a=document.createElement("a");a.href=urls[index];a.download=files[index].split("/").pop();a.target="_blank";a.click();}
document.addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="ArrowRight")openLB((index+1)%files.length);if(e.key==="ArrowLeft")openLB((index-1+files.length)%files.length);if(e.key==="Escape")closeLB();});lb.onclick=e=>{if(e.target===lb)closeLB()};load().catch(console.error);
</script></body></html>
