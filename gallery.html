<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Gallery</title><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="js/config.js"></script>
<script src="js/app.js"></script><style>:root{--bg:#05060A;--card:#111827;--text:#E5E7EB;--muted:#9CA3AF}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}.nav{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;background:rgba(5,6,10,.85);backdrop-filter:blur(10px);z-index:1000}.nav-left,.brand-link{display:flex;align-items:center;gap:.85rem}.brand-link{text-decoration:none;color:inherit}.nav img{height:44px;width:auto}.nav h1{font-size:1.15rem;font-weight:600;letter-spacing:.02em}.burger{font-size:1.4rem;cursor:pointer}.menu{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.5rem;transform:translateY(-100%);transition:.35s ease;z-index:999}.menu.open{transform:translateY(0)}.menu button{background:none;border:none;color:white;font-size:1.2rem;cursor:pointer}.menu-divider{width:200px;height:1px;background:rgba(255,255,255,.15);margin:1.5rem 0}.contact-btn{display:flex;align-items:center;justify-content:center;width:200px;margin-top:1.2rem;padding:.75rem 1rem;font-size:.9rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#05060A;background:white;border-radius:10px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:.25s ease}.contact-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.45)}a{color:#9CA3AF;text-decoration:none}body{padding-top:64px}.page-link{padding:1rem;display:inline-block}.grid{columns:4 260px;column-gap:1rem;padding:1rem}.grid img,.grid video{width:100%;margin-bottom:1rem;border-radius:12px;cursor:pointer;background:#111827}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:2000}.lightbox.open{display:flex}.box{background:#0b0b0b;padding:1rem;border-radius:16px}.box img,.box video{max-width:80vw;max-height:70vh}.controls{display:flex;justify-content:space-between;gap:.75rem;margin-top:.75rem}button{background:#1f2937;border:none;color:white;padding:.5rem .9rem;border-radius:8px;cursor:pointer}</style></head><body><div class="nav">
  <div class="nav-left">
    <a href="index.html" class="brand-link">
      <img data-logo src="assets/DVascon_Productions_Logo.png" alt="DVascon Productions logo">
      <h1 data-site-title>DVascon Productions</h1>
    </a>
  </div>
  <i class="fa-solid fa-bars burger" onclick="toggleMenu()"></i>
</div>
<div class="menu" id="menu">
  <div id="menuSports"></div>
  <div class="menu-divider"></div>
  <a data-contact href="https://dot.cards/dvascon_productions" target="_blank" class="contact-btn">Contact</a>
</div><a class="page-link" href="javascript:history.back()">← Back</a><div class="grid" id="gallery"></div><div class="lightbox" id="lb"><div class="box"><div id="mediaBox"></div><div class="controls"><button onclick="downloadCurrent()">⬇ Download</button><button onclick="closeLB()">✕</button></div></div></div>
<script>
let files=[], urls=[], index=0, fileNames=[];
const gallery = document.getElementById('gallery'), lb = document.getElementById('lb'), mediaBox = document.getElementById('mediaBox');
loadData().then(data => {
  buildNav(data);
  const sport = findSport(data, qs('sport'));
  const team = findTeam(sport, qs('team'));
  const event = findEvent(team, qs('event'));
  if(!event) return showEmpty(gallery, 'Gallery not found.');
  fileNames = event.files || [];
  urls = fileNames.map(file => eventFileUrl(sport, team, event, file));
  if(!fileNames.length) return showEmpty(gallery, 'No media found for this event yet.');
  fileNames.forEach((file,i) => {
    let el;
    if(isVideo(file)){ el = document.createElement('video'); el.src = urls[i]; el.muted = true; el.playsInline = true; el.preload = 'metadata'; }
    else { el = document.createElement('img'); el.src = urls[i]; el.loading = 'lazy'; }
    el.onclick = () => openLB(i);
    gallery.appendChild(el);
  });
}).catch(console.error);
function renderCurrent(){ mediaBox.innerHTML = ''; const file = fileNames[index]; let el; if(isVideo(file)){ el = document.createElement('video'); el.src = urls[index]; el.controls = true; el.autoplay = true; } else { el = document.createElement('img'); el.src = urls[index]; } mediaBox.appendChild(el); }
function openLB(i){ index = i; renderCurrent(); lb.classList.add('open'); }
function closeLB(){ lb.classList.remove('open'); mediaBox.innerHTML = ''; }
function downloadCurrent(){ const a = document.createElement('a'); a.href = urls[index]; a.download = fileNames[index]; a.target = '_blank'; a.click(); }
document.addEventListener('keydown', e => { if(!lb.classList.contains('open')) return; if(e.key === 'ArrowRight') openLB((index+1)%fileNames.length); if(e.key === 'ArrowLeft') openLB((index-1+fileNames.length)%fileNames.length); if(e.key === 'Escape') closeLB(); });
lb.onclick = e => { if(e.target === lb) closeLB(); };
</script></body></html>
