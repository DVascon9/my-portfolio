<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Private Galleries | DVascon Productions</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="js/styles.css"
  >

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>


  <style>

    /* =====================================================
       PRIVATE GALLERY PAGE
       ===================================================== */

    body {
      background: #050608;
      color: white;
    }


    .private-page {

      min-height: calc(100vh - 70px);

      padding:
        120px 24px
        70px;

      max-width: 1200px;

      margin: auto;

      box-sizing: border-box;

    }


    /* =====================================================
       HEADER
       ===================================================== */

    .private-header {

      text-align: center;

      max-width: 700px;

      margin:
        0 auto 55px;

    }


    .private-lock {

      width: 68px;
      height: 68px;

      margin:
        0 auto 22px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(255,255,255,.06);

      border:
        1px solid
        rgba(255,255,255,.12);

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.35);

    }


    .private-lock i {

      font-size: 25px;

      color: white;

    }


    .private-header h2 {

      font-size:
        clamp(2rem, 4vw, 3rem);

      margin:
        0 0 12px;

      font-weight: 700;

      letter-spacing: -.04em;

    }


    .private-header p {

      margin: 0;

      color: #9ca3af;

      font-size: 1rem;

      line-height: 1.7;

    }


    /* =====================================================
       GALLERY GRID
       ===================================================== */

    .private-grid {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(240px, 1fr)
        );

      gap: 22px;

      width: 100%;

    }


    /* =====================================================
       GALLERY CARD
       ===================================================== */

    .private-card {

      position: relative;

      min-height: 190px;

      padding: 30px;

      box-sizing: border-box;

      cursor: pointer;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          #111827,
          #0c111b
        );

      border:
        1px solid
        rgba(255,255,255,.08);

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.25);

      transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

    }


    .private-card::before {

      content: "";

      position: absolute;

      inset: 0;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255,255,255,.07),
          transparent 55%
        );

      opacity: .7;

      pointer-events: none;

    }


    .private-card:hover {

      transform:
        translateY(-6px);

      border-color:
        rgba(255,255,255,.2);

      box-shadow:
        0 20px 50px
        rgba(0,0,0,.4);

    }


    .private-card:active {

      transform:
        translateY(-2px);

    }


    .private-card-icon {

      position: relative;

      width: 58px;
      height: 58px;

      border-radius: 16px;

      display: flex;

      align-items: center;
      justify-content: center;

      margin-bottom: 20px;

      background:
        rgba(255,255,255,.07);

      border:
        1px solid
        rgba(255,255,255,.1);

    }


    .private-card-icon i {

      font-size: 22px;

    }


    .private-card h3 {

      position: relative;

      margin: 0;

      font-size: 1.15rem;

      font-weight: 600;

      letter-spacing: -.01em;

    }


    .private-card p {

      position: relative;

      margin:
        9px 0 0;

      color: #9ca3af;

      font-size: .85rem;

    }


    .private-card-arrow {

      position: absolute;

      right: 18px;
      bottom: 18px;

      width: 30px;
      height: 30px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(255,255,255,.05);

      color: #9ca3af;

      font-size: 12px;

      transition:
        transform .25s ease,
        background .25s ease;

    }


    .private-card:hover
    .private-card-arrow {

      transform:
        translateX(3px);

      background:
        rgba(255,255,255,.1);

      color: white;

    }


    /* =====================================================
       EMPTY / LOADING
       ===================================================== */

    .private-message {

      grid-column:
        1 / -1;

      text-align: center;

      color: #9ca3af;

      padding: 50px 20px;

    }


    /* =====================================================
       PASSWORD OVERLAY
       ===================================================== */

    .password-overlay {

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.88);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 3000;

      padding: 20px;

      box-sizing: border-box;

    }


    .password-overlay.open {

      display: flex;

    }


    /* =====================================================
       PASSWORD BOX
       ===================================================== */

    .password-box {

      width:
        min(430px, 100%);

      box-sizing: border-box;

      padding:
        35px;

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          #111827,
          #090c12
        );

      border:
        1px solid
        rgba(255,255,255,.1);

      box-shadow:
        0 30px 90px
        rgba(0,0,0,.65);

      text-align: center;

      animation:
        passwordIn .2s ease;

    }


    @keyframes passwordIn {

      from {

        opacity: 0;

        transform:
          translateY(12px)
          scale(.98);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    .password-icon {

      width: 64px;
      height: 64px;

      margin:
        0 auto 20px;

      border-radius: 18px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(255,255,255,.07);

      border:
        1px solid
        rgba(255,255,255,.1);

    }


    .password-icon i {

      font-size: 24px;

    }


    .password-box h3 {

      margin:
        0 0 9px;

      font-size: 1.35rem;

    }


    .password-box > p {

      margin:
        0 0 22px;

      color: #9ca3af;

      font-size: .9rem;

      line-height: 1.5;

    }


    /* =====================================================
       PASSWORD INPUT
       ===================================================== */

    .password-input-wrapper {

      position: relative;

    }


    .password-box input {

      width: 100%;

      box-sizing: border-box;

      padding:
        14px 45px 14px 15px;

      border-radius: 11px;

      border:
        1px solid
        rgba(255,255,255,.1);

      outline: none;

      background:
        #080b10;

      color: white;

      font-size: 1rem;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;

    }


    .password-box input::placeholder {

      color: #6b7280;

    }


    .password-box input:focus {

      border-color:
        rgba(255,255,255,.35);

      box-shadow:
        0 0 0 3px
        rgba(255,255,255,.05);

    }


    /* =====================================================
       PASSWORD ERROR
       ===================================================== */

    #passwordError {

      min-height: 22px;

      margin:
        10px 0 5px;

      color: #f87171;

      font-size: .85rem;

    }


    /* =====================================================
       PASSWORD BUTTONS
       ===================================================== */

    .password-actions {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-top: 10px;

    }


    .password-actions button {

      border: none;

      padding:
        12px 16px;

      border-radius: 10px;

      cursor: pointer;

      font-family: inherit;

      font-size: .9rem;

      font-weight: 600;

      transition:
        transform .2s ease,
        opacity .2s ease,
        background .2s ease;

    }


    .password-actions button:hover {

      transform:
        translateY(-1px);

    }


    .password-actions button:active {

      transform:
        translateY(0);

    }


    .password-actions .cancel {

      background:
        rgba(255,255,255,.07);

      color: white;

      border:
        1px solid
        rgba(255,255,255,.08);

    }


    .password-actions .enter {

      background: white;

      color: #050608;

    }


    .password-actions button:disabled {

      opacity: .5;

      cursor: not-allowed;

      transform: none;

    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      .private-page {

        padding:
          105px 18px 50px;

      }


      .private-header {

        margin-bottom: 35px;

      }


      .private-header h2 {

        font-size: 2rem;

      }


      .private-grid {

        grid-template-columns:
          1fr;

        gap: 15px;

      }


      .private-card {

        min-height: 165px;

      }


      .password-box {

        padding: 28px 22px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       NAVIGATION
       ===================================================== -->

  <div class="nav">

    <a
      class="brand"
      href="index.html"
    >

      <img
        src="assets/DVascon_Productions_Logo.png"
        alt="DVascon Productions logo"
      >

      <h1 data-site-title>
        DVascon Productions
      </h1>

    </a>


    <i
      class="fa-solid fa-bars burger"
      onclick="toggleMenu()"
    ></i>

  </div>


  <div
    class="menu"
    id="menu"
  >

    <div id="menuSports"></div>


    <a
      data-contact
      target="_blank"
    >
      Contact
    </a>

  </div>


  <!-- =====================================================
       PRIVATE GALLERIES
       ===================================================== -->

  <main class="private-page">


    <div class="private-header">

      <div class="private-lock">

        <i
          class="fa-solid fa-lock"
        ></i>

      </div>


      <h2>
        Private Galleries
      </h2>


      <p>
        Your photos, securely delivered.
        Select your gallery below and enter
        the password provided by DVascon Productions.
      </p>

    </div>


    <div
      id="privateGrid"
      class="private-grid"
    >

      <div class="private-message">
        Loading private galleries...
      </div>

    </div>


  </main>


  <!-- =====================================================
       PASSWORD WINDOW
       ===================================================== -->

  <div
    id="passwordOverlay"
    class="password-overlay"
  >

    <div class="password-box">


      <div class="password-icon">

        <i
          class="fa-solid fa-lock"
        ></i>

      </div>


      <h3
        id="passwordTitle"
      >
        Private Gallery
      </h3>


      <p>
        Enter your gallery password
        to continue.
      </p>


      <div class="password-input-wrapper">

        <input
          id="passwordInput"
          type="password"
          placeholder="Enter password"
          autocomplete="current-password"
        >

      </div>


      <div
        id="passwordError"
      ></div>


      <div class="password-actions">

        <button
          class="cancel"
          onclick="closePassword()"
        >
          Cancel
        </button>


        <button
          class="enter"
          id="unlockButton"
          onclick="submitPassword()"
        >
          Unlock Gallery
        </button>

      </div>


    </div>

  </div>


<script>


/* =========================================================
   CURRENTLY SELECTED FOLDER
   ========================================================= */

let selectedFolder = "";


/* =========================================================
   LOAD PRIVATE FOLDERS
   ========================================================= */

async function loadPrivateFolders() {

  const grid =
    document.getElementById(
      "privateGrid"
    );


  try {

    await buildMenu();


    const response =
      await fetch(
        "/api/private-folders",
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Could not load private galleries."
      );

    }


    const data =
      await response.json();


    if (
      !data.folders ||
      !data.folders.length
    ) {

      grid.innerHTML = `

        <div class="private-message">

          <i
            class="fa-solid fa-folder-open"
            style="
              font-size:2rem;
              margin-bottom:15px;
              display:block;
            "
          ></i>

          No private galleries yet.

        </div>

      `;

      return;

    }


    grid.innerHTML = "";


    data.folders.forEach(folder => {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "private-card";


      const displayName =
        folder.name
          .replace(/-/g, " ")
          .replace(/\b\w/g, letter =>
            letter.toUpperCase()
          );


      card.innerHTML = `

        <div class="private-card-icon">

          <i
            class="fa-solid fa-folder-lock"
          ></i>

        </div>


        <h3>
          ${displayName}
        </h3>


        <p>
          Password protected
        </p>


        <div class="private-card-arrow">

          <i
            class="fa-solid fa-arrow-right"
          ></i>

        </div>

      `;


      card.onclick = () => {

        openPassword(
          folder.key,
          displayName
        );

      };


      grid.appendChild(
        card
      );

    });


  } catch (error) {

    console.error(error);


    grid.innerHTML = `

      <div
        class="private-message"
        style="color:#f87171;"
      >

        <i
          class="fa-solid fa-triangle-exclamation"
          style="
            font-size:2rem;
            margin-bottom:15px;
            display:block;
          "
        ></i>

        ${error.message}

      </div>

    `;

  }

}


/* =========================================================
   OPEN PASSWORD WINDOW
   ========================================================= */

function openPassword(
  folder,
  name
) {

  selectedFolder =
    folder;


  document.getElementById(
    "passwordTitle"
  ).textContent =
    name;


  document.getElementById(
    "passwordInput"
  ).value = "";


  document.getElementById(
    "passwordError"
  ).textContent = "";


  document.getElementById(
    "unlockButton"
  ).disabled = false;


  document.getElementById(
    "passwordOverlay"
  ).classList.add(
    "open"
  );


  setTimeout(() => {

    document.getElementById(
      "passwordInput"
    ).focus();

  }, 100);

}


/* =========================================================
   CLOSE PASSWORD WINDOW
   ========================================================= */

function closePassword() {

  document.getElementById(
    "passwordOverlay"
  ).classList.remove(
    "open"
  );

}


/* =========================================================
   SUBMIT PASSWORD
   ========================================================= */

async function submitPassword() {

  const input =
    document.getElementById(
      "passwordInput"
    );


  const error =
    document.getElementById(
      "passwordError"
    );


  const button =
    document.getElementById(
      "unlockButton"
    );


  const password =
    input.value;


  if (!password) {

    error.textContent =
      "Please enter a password.";

    input.focus();

    return;

  }


  error.textContent =
    "Checking password...";


  button.disabled =
    true;


  try {

    const response =
      await fetch(
        "/api/private-login",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              folder:
                selectedFolder,

              password:
                password

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      error.textContent =
        data.error ||
        "Incorrect password.";

      button.disabled =
        false;

      input.focus();

      input.select();

      return;

    }


    location.href =
      `private-gallery.html?folder=${
        encodeURIComponent(
          selectedFolder
        )
      }`;


  } catch (err) {

    console.error(err);


    error.textContent =
      "Something went wrong. Please try again.";


    button.disabled =
      false;

  }

}


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

document
  .getElementById(
    "passwordInput"
  )
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        submitPassword();

      }


      if (
        event.key === "Escape"
      ) {

        closePassword();

      }

    }
  );


/* =========================================================
   CLOSE WHEN CLICKING OUTSIDE
   ========================================================= */

document
  .getElementById(
    "passwordOverlay"
  )
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "passwordOverlay"
      ) {

        closePassword();

      }

    }
  );


/* =========================================================
   START
   ========================================================= */

loadPrivateFolders();

</script>


</body>

</html>
